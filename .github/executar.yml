name: Executar Script Python

on: [push] # Executa toda vez que você enviar código para o GitHub

jobs:
  run-python:
    runs-on: ubuntu-latest
    
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências (Opcional)
      run: |
        python -m pip install --upgrade pip
        # Se tiver um arquivo requirements.txt, descomente a linha abaixo:
        # pip install -r requirements.txt

    - name: Executar o Script
      run: python gerar_previsao_ecmwf # Substitua pelo nome do seu arquivo
