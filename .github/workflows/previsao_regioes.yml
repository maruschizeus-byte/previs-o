name: previsao-regioes

# Coloque em .github/workflows/previsao_regioes.yml
# Arquivos esperados na raiz do repo: gerar_previsao_regiao.py, estados.kml,
# mesorregioes.kml, Cidades_principais_137_mesorregioes_Brasil.csv e
# (opcional) logo.png. Saída: pasta previsao_regioes/, publicada no ramo
# "mapas". Esse ramo tem um único commit, trocado a cada execução: os arquivos
# ficam no repositório, mas o histórico não cresce. O ramo principal fica só
# com o código. Todo dia às 06:05 (Brasília) roda tudo: Brasil, as 5 regiões
# (Norte, Nordeste, Centro-Oeste, Sudeste e Sul), 27 estados e 137 mesorregiões,
# com chuva do dia, chuva acumulada e temperaturas mínima e máxima.
# (Os mapas da AMAGGI e os de nuvens são feitos só no computador.)
# Todos os períodos usam America/Sao_Paulo, de 00 h a 00 h do dia seguinte.
#
# Uso manual: aba Actions > previsao-regioes > Run workflow.
#   - "Todas as mesorregiões" já vem marcado -> é só clicar em Run.
#   - Para gerar só algumas regiões, DESMARQUE e preencha "Regiões".
#   - A execução completa (agendada, ou com "Todas" marcado) substitui todos os
#     mapas do ramo. A parcial (com "Regiões") troca só as áreas geradas.
#   - Confira os caminhos dos KMLs, inclusive letras maiúsculas/minúsculas.
#   - As pastas incluem regiao.json e são preparadas antes dos downloads.

on:
  workflow_dispatch:
    inputs:
      todas_meso:
        description: "Gerar TODAS as mesorregiões"
        type: boolean
        default: true
      dias:
        description: "Dias: 0=hoje, 1=amanhã, até 7. Hoje é sempre incluído."
        type: string
        default: "0 1 2 3 4 5 6 7"
      vars:
        description: "Variáveis: chuva tmin tmax (nuvem também existe)"
        default: "chuva tmin tmax"
      regioes:
        description: "Só se DESMARCAR acima — regiões (ex.: SP;MG;3105)"
        default: ""
      recortar:
        description: "Recortar o preenchimento ao contorno da região"
        type: boolean
        default: false
      kml_estados:
        description: "Caminho do KML de estados no repositório"
        type: string
        default: "estados.kml"
      kml_meso:
        description: "Caminho do KML de mesorregiões no repositório"
        type: string
        default: "mesorregioes.kml"
      cidades:
        description: "CSV ou KML com as cidades de referência"
        type: string
        default: "Cidades_principais_137_mesorregioes_Brasil.csv"
  schedule:
    # 06:05 de Brasília (BRT = UTC-3, sem horário de verão) = 09:05 UTC, todo dia.
    - cron: "5 9 * * *"

permissions:
  contents: write

concurrency:
  group: previsao-regioes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      RAMO_MAPAS: mapas
    steps:
      - uses: actions/checkout@v4

      - name: trazer os mapas publicados (só na execução parcial)
        # Completa (agendada ou com "Todas"): começa do zero e o ramo mapas fica
        # só com os mapas desta execução. Parcial (com "Regiões"): traz os mapas
        # atuais para as outras áreas continuarem publicadas.
        env:
          COMPLETA: ${{ github.event_name == 'schedule' || inputs.todas_meso }}
        run: |
          rm -rf previsao_regioes
          if [ "$COMPLETA" = "true" ]; then
            echo "Execução completa: os mapas do ramo $RAMO_MAPAS serão substituídos por inteiro."
          elif git fetch --depth 1 origin "$RAMO_MAPAS" 2>/dev/null; then
            git archive FETCH_HEAD previsao_regioes | tar -x
            # Grupos de pontos (ex.: AMAGGI) são feitos só no computador.
            python3 - <<'PY'
          import json, os, shutil
          for nome in sorted(os.listdir("previsao_regioes")):
              try:
                  info = json.load(open(os.path.join("previsao_regioes", nome, "regiao.json"), encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if isinstance(info, dict) and info.get("tipo") == "grupo":
                  shutil.rmtree(os.path.join("previsao_regioes", nome))
                  print(f"Removida a pasta {nome}/ (grupo de pontos, gerado só no computador).")
          PY
            echo "Mapas atuais trazidos do ramo $RAMO_MAPAS: $(find previsao_regioes -name '*.png' | wc -l) PNGs."
          else
            echo "Ramo $RAMO_MAPAS ainda não existe; começa do zero."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: eccodes (para o cfgrib ler GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: dependências python
        run: |
          python -m pip install --upgrade pip
          # >=0.3.34: aceita limite de tentativas e tem o espelho google
          pip install "ecmwf-opendata>=0.3.34" xarray cfgrib numpy matplotlib

      - name: data de Brasília para a chave de cache
        id: dt
        run: echo "d=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # restore/save separados: o cache é salvo mesmo se a geração falhar,
      # então um novo "Run workflow" continua de onde parou.
      - name: restaurar cache do download ECMWF do dia
        id: cache_ecmwf
        uses: actions/cache/restore@v4
        with:
          path: .cache_ecmwf
          key: ecmwf-brasilia-v1-${{ steps.dt.outputs.d }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecmwf-brasilia-v1-${{ steps.dt.outputs.d }}-
            ecmwf-brasilia-v1-

      - name: validar KMLs, criar pastas e gerar figuras
        env:
          TODAS:   ${{ github.event_name == 'schedule' || inputs.todas_meso }}
          DIAS:    ${{ inputs.dias    || '0 1 2 3 4 5 6 7' }}
          VARS:    ${{ inputs.vars    || 'chuva tmin tmax' }}
          REGIOES: ${{ inputs.regioes || '' }}
          RECORTAR: ${{ inputs.recortar || false }}
          KML_ESTADOS: ${{ inputs.kml_estados || 'estados.kml' }}
          KML_MESO: ${{ inputs.kml_meso || 'mesorregioes.kml' }}
          CIDADES: ${{ inputs.cidades || 'Cidades_principais_137_mesorregioes_Brasil.csv' }}
        run: |
          set -euo pipefail
          read -r -a dias_args <<< "$DIAS"
          read -r -a vars_args <<< "$VARS"
          # Inclui hoje mesmo se o formulário enviar a configuração antiga (1 a 7).
          # O script elimina dias repetidos antes de calcular e gerar as figuras.
          args=(
            --todos-estados --regioes-brasil
            --kml "$KML_ESTADOS" "$KML_MESO"
            --fundo "$KML_ESTADOS"
            --kml-meso "$KML_MESO"
            --cidades "$CIDADES"
            --logo logo.png
            --vars "${vars_args[@]}" --dias 0 "${dias_args[@]}"
            --saida previsao_regioes
          )
          if [ "$TODAS" = "true" ]; then
            args+=(--todas-meso)
          elif [ -n "$REGIOES" ]; then
            args+=(--regioes "$REGIOES")
          else
            echo "::error::Marque Todas as mesorregiões ou preencha Regiões."
            exit 1
          fi
          if [ "$RECORTAR" = "true" ]; then
            args+=(--recortar)
          fi
          # Confere a separação dos KMLs sem depender do ECMWF.
          python -u gerar_previsao_regiao.py "${args[@]}" --somente-estrutura
          python -u gerar_previsao_regiao.py "${args[@]}"

      - name: salvar cache do download ECMWF (mesmo com falha)
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache_ecmwf
          key: ${{ steps.cache_ecmwf.outputs.cache-primary-key }}

      - name: guardar mapas e estrutura para download
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: previsao-regioes-${{ github.run_id }}-${{ github.run_attempt }}
          path: previsao_regioes/
          if-no-files-found: ignore
          retention-days: 7

      - name: publicar no ramo mapas (substitui a versão anterior)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit novo, sem pai, montado num índice à parte: não mexe no ramo principal.
          export GIT_INDEX_FILE="$RUNNER_TEMP/indice-mapas"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git add -f -- previsao_regioes
          if [ -f index.html ]; then git add -f -- index.html; fi   # painel, se quiser GitHub Pages
          vazio=$(git hash-object -w --stdin < /dev/null)
          git update-index --add --cacheinfo "100644,$vazio,.nojekyll"
          arvore=$(git write-tree)
          commit=$(git commit-tree "$arvore" -m "mapas de previsão $(date +%Y-%m-%dT%H:%M%z)")
          unset GIT_INDEX_FILE
          for i in 1 2 3 4 5; do
            if git push --force origin "$commit:refs/heads/$RAMO_MAPAS"; then
              echo "Publicado no ramo $RAMO_MAPAS: $(git ls-tree -r --name-only "$commit" | grep -c '\.png$') PNGs."
              exit 0
            fi
            echo "retry $i..."; sleep 10
          done
          echo "Falhou ao publicar no ramo $RAMO_MAPAS após 5 tentativas."; exit 1

      - name: tirar os mapas do ramo principal (só na primeira vez)
        run: |
          set -euo pipefail
          if [ -z "$(git ls-files -- previsao_regioes | head -1)" ]; then
            echo "O ramo principal já não guarda os mapas."; exit 0
          fi
          git rm -r -q --cached -- previsao_regioes
          grep -qxF 'previsao_regioes/' .gitignore 2>/dev/null || echo 'previsao_regioes/' >> .gitignore
          git add .gitignore
          git commit -q -m "mapas passam a ficar no ramo $RAMO_MAPAS"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push -q origin "HEAD:${GITHUB_REF_NAME}" && { echo "Pasta previsao_regioes/ removida do ramo ${GITHUB_REF_NAME}."; exit 0; } \
              || { echo "retry $i..."; sleep 5; }
          done
          echo "Falhou ao atualizar o ramo principal após 5 tentativas."; exit 1
