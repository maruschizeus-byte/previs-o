name: previsao-regioes

# Como usar:
#  - Manual (aba Actions > Run workflow): digite as regiões, o KML e os dias.
#  - Automático: roda todo dia no horário do cron abaixo com a lista padrão.
#
# Requer que o KML (ex.: estados.kml) e o gerar_previsao_regiao.py estejam
# na raiz do repositório. As figuras vão para a pasta previsao_regioes/ e são
# commitadas de volta.

on:
  workflow_dispatch:
    inputs:
      regioes:
        description: "Regiões separadas por ; (nome, sigla ou código IBGE) — ex.: SP;MG;3105"
        required: false
        default: "SP;MG;GO;MT;BA"
      kml:
        description: "KML(s) separados por espaço (estados e/ou mesorregiões)"
        required: false
        default: "estados.kml mesorregioes.kml"
      fundo:
        description: "KML(s) do contorno de fundo (estados). Vazio = detecta 'estado' no nome"
        required: false
        default: "estados.kml"
      cidades:
        description: "Arquivo de cidades (CSV nome,lat,lon ou KML de pontos) — opcional"
        required: false
        default: ""
      logo:
        description: "PNG de logo para sobrepor (vazio = sem logo)"
        required: false
        default: "logo.png"
      dias:
        description: "Horizontes em dias"
        required: false
        default: "1 2 3 4 5 6 7"
      vars:
        description: "Variáveis (espaço): chuva tmin tmax nuvem"
        required: false
        default: "chuva tmin tmax nuvem"
      fonte:
        description: "Fonte ECMWF em ordem (espelhos evitam 429): aws azure ecmwf"
        required: false
        default: "aws azure ecmwf"
      recortar:
        description: "Recortar o preenchimento ao polígono? (sim/nao)"
        required: false
        default: "nao"
      todas_meso:
        description: "Gerar TODAS as mesorregiões (pastas UF/mesorregião)? (sim/nao)"
        required: false
        default: "nao"
  schedule:
    # 09:00 UTC = ~06:00 Brasília, depois de a rodada 00z do ECMWF ficar pronta.
    - cron: "0 9 * * *"

# necessário para o GITHUB_TOKEN conseguir commitar de volta no repositório
permissions:
  contents: write

# evita duas execuções simultâneas empurrando commits ao mesmo tempo
concurrency:
  group: previsao-regioes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: eccodes (para o cfgrib ler GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0
          # Alternativa sem apt, se algum dia mudar o nome do pacote:
          #   pip install ecmwflibs

      - name: dependências python
        run: |
          python -m pip install --upgrade pip
          pip install ecmwf-opendata xarray cfgrib numpy matplotlib

      - name: data (UTC) para a chave de cache
        id: dt
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: cache do download ECMWF do dia
        uses: actions/cache@v4
        with:
          path: .cache_ecmwf
          # chave por DIA: a 1ª execução do dia baixa e salva; as seguintes
          # (reexecução manual, nova região) restauram e não rebaixam.
          key: ecmwf-cache-${{ steps.dt.outputs.d }}

      - name: gerar figuras
        env:
          REGIOES:  ${{ github.event.inputs.regioes  || 'SP;MG;GO;MT;BA' }}
          KML:      ${{ github.event.inputs.kml      || 'estados.kml mesorregioes.kml' }}
          DIAS:     ${{ github.event.inputs.dias     || '1 2 3 4 5 6 7' }}
          VARS:     ${{ github.event.inputs.vars     || 'chuva tmin tmax nuvem' }}
          FONTE:    ${{ github.event.inputs.fonte    || 'aws azure ecmwf' }}
          RECORTAR: ${{ github.event.inputs.recortar || 'nao' }}
          FUNDO:    ${{ github.event.inputs.fundo     || 'estados.kml' }}
          CIDADES:  ${{ github.event.inputs.cidades   || '' }}
          LOGO:     ${{ github.event.inputs.logo      || 'logo.png' }}
          TODAS_MESO: ${{ github.event.inputs.todas_meso || 'nao' }}
        run: |
          set -e
          FLAGS=""
          [ "$RECORTAR"   = "sim" ] && FLAGS="$FLAGS --recortar"
          [ "$TODAS_MESO" = "sim" ] && FLAGS="$FLAGS --todas-meso"
          [ -n "$FUNDO" ]           && FLAGS="$FLAGS --fundo $FUNDO"
          [ -n "$CIDADES" ]         && FLAGS="$FLAGS --cidades $CIDADES"
          [ -n "$LOGO" ]            && FLAGS="$FLAGS --logo $LOGO"
          # UMA única chamada: baixa cada horizonte do ECMWF 1x e recorta
          # todas as regiões a partir do mesmo dado.
          python -u gerar_previsao_regiao.py \
            --regioes "$REGIOES" \
            --kml $KML \
            --vars $VARS \
            --fonte $FONTE \
            --dias $DIAS \
            --saida previsao_regioes $FLAGS

      - name: commit e push (à prova de conflito)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previsao_regioes
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar."; exit 0
          fi
          git commit -m "previsão por região $(date -u +%Y-%m-%dT%H:%MZ)"
          # tenta empurrar rebaseando por cima de commits que chegaram no meio
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0 || (echo "retry $i..."; sleep 5)
          done
          echo "Falhou ao dar push após 5 tentativas."; exit 1
