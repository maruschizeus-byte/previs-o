name: previsao-regioes

# Coloque em .github/workflows/previsao_regioes.yml
# Arquivos esperados na raiz do repo: gerar_previsao_regiao.py, estados.kml,
# mesorregioes.kml e (opcional) logo.png. Saída: pasta previsao_regioes/.
#
# Uso manual: aba Actions > previsao-regioes > Run workflow.
#   - "Todas as mesorregiões" já vem marcado -> é só clicar em Run.
#   - Para gerar só algumas regiões, DESMARQUE e preencha "Regiões".

on:
  workflow_dispatch:
    inputs:
      todas_meso:
        description: "Gerar TODAS as mesorregiões"
        type: boolean
        default: true
      dias:
        description: "Dias de previsão"
        default: "1 2 3 4 5 6 7"
      vars:
        description: "Variáveis: chuva tmin tmax nuvem"
        default: "chuva tmin tmax nuvem"
      regioes:
        description: "Só se DESMARCAR acima — regiões (ex.: SP;MG;3105)"
        default: ""
      recortar:
        description: "Recortar o preenchimento ao contorno da região"
        type: boolean
        default: false
  schedule:
    # 09:00 UTC = ~06:00 Brasília, após a rodada 00z do ECMWF.
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: previsao-regioes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: eccodes (para o cfgrib ler GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: dependências python
        run: |
          python -m pip install --upgrade pip
          pip install ecmwf-opendata xarray cfgrib numpy matplotlib

      - name: data (UTC) para a chave de cache
        id: dt
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: cache do download ECMWF do dia
        uses: actions/cache@v4
        with:
          path: .cache_ecmwf
          key: ecmwf-cache-${{ steps.dt.outputs.d }}

      - name: gerar figuras
        env:
          TODAS:   ${{ github.event.inputs.todas_meso || 'true' }}
          DIAS:    ${{ github.event.inputs.dias       || '1 2 3 4 5 6 7' }}
          VARS:    ${{ github.event.inputs.vars       || 'chuva tmin tmax nuvem' }}
          REGIOES: ${{ github.event.inputs.regioes    || '' }}
        run: |
          set -e
          # fixos: KML de busca, fundo = estados, logo; fonte usa os espelhos
          # (padrão do script: aws azure ecmwf).
          if [ "$TODAS" = "true" ] || [ -z "$REGIOES" ]; then
            python -u gerar_previsao_regiao.py \
              --todas-meso \
              --kml estados.kml mesorregioes.kml \
              --fundo estados.kml \
              --logo logo.png \
              --vars $VARS --dias $DIAS \
              --saida previsao_regioes
          else
            python -u gerar_previsao_regiao.py \
              --regioes "$REGIOES" \
              --kml estados.kml mesorregioes.kml \
              --fundo estados.kml \
              --logo logo.png \
              --vars $VARS --dias $DIAS \
              --saida previsao_regioes
          fi

      - name: commit e push (à prova de conflito)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previsao_regioes
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar."; exit 0
          fi
          git commit -m "previsão por região $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && exit 0 || (echo "retry $i..."; sleep 5)
          done
          echo "Falhou ao dar push após 5 tentativas."; exit 1
